name: M3D Summarize Aqua Arrow Trace Once

on:
  push:
    branches:
      - agent/rust-direct-damage-runtime

permissions:
  contents: write

jobs:
  summarize-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-direct-damage-runtime

      - name: Decode and summarize trace
        shell: python
        run: |
          import base64
          import gzip
          import json
          from pathlib import Path

          fixture = Path("fixtures/parity/ability-aqua-arrow-basic")
          encoded = (fixture / "expected-trace.json.gz.b64").read_text(encoding="utf-8").strip()
          trace = json.loads(gzip.decompress(base64.b64decode(encoded)).decode("utf-8"))
          events = trace.get("events", [])

          def event_type(entry):
              event = entry.get("event") if isinstance(entry, dict) else None
              return event.get("type") if isinstance(event, dict) else None

          ability_indexes = [
              index for index, entry in enumerate(events)
              if event_type(entry) == "abilityCastEndEvent"
          ]
          selected_indexes = set(range(min(30, len(events))))
          for index in ability_indexes:
              selected_indexes.update(range(max(0, index - 2), min(len(events), index + 3)))

          summary = {
              "traceKeys": sorted(trace.keys()),
              "eventCount": len(events),
              "truncatedEntries": trace.get("truncatedEntries"),
              "abilityCastEndIndexes": ability_indexes,
              "eventTypeCounts": {},
              "selectedEvents": [
                  {"index": index, **events[index]}
                  for index in sorted(selected_indexes)
              ],
          }
          for entry in events:
              kind = event_type(entry) or "<unknown>"
              summary["eventTypeCounts"][kind] = summary["eventTypeCounts"].get(kind, 0) + 1
          summary["eventTypeCounts"] = dict(sorted(summary["eventTypeCounts"].items()))

          output = Path("docs/architecture/m3d-aqua-arrow-trace-summary.json")
          output.write_text(json.dumps(summary, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

      - name: Remove workflow and commit summary
        run: |
          rm .github/workflows/m3d-summarize-aqua-trace-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/m3d-aqua-arrow-trace-summary.json .github/workflows/m3d-summarize-aqua-trace-once.yml
          git commit -m "test: summarize Aqua Arrow reference trace"
          git push origin HEAD:agent/rust-direct-damage-runtime
