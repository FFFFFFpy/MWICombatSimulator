name: M2 Format Once

on:
  push:
    branches:
      - agent/rust-basic-combat

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-basic-combat

      - name: Install Rust formatter
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Apply exact Fly passive mapping
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/sim-core/src/basic_combat.rs")
          text = path.read_text(encoding="utf-8")
          marker = "    fn enemy(data: &BasicGameData) -> Self {"
          start = text.index(marker)
          before = text[:start]
          after = text[start:]
          old = "            auto_attack_damage: 0.0,"
          new = "            auto_attack_damage: data.monster.auto_attack_damage,"
          if after.count(old) != 1:
              raise SystemExit(f"expected one enemy auto_attack_damage placeholder, found {after.count(old)}")
          path.write_text(before + after.replace(old, new, 1), encoding="utf-8")

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Remove one-time workflow
        run: rm .github/workflows/m2-format-once.yml

      - name: Commit formatted M2 sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates .github/workflows/m2-format-once.yml
          git commit -m "style: format M2 Rust sources"
          git push origin HEAD:agent/rust-basic-combat
