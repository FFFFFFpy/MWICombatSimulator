name: Cleanup Rust Lockfile Workflow

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/rust-core-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Rust branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rust-lock-once.yml .github/workflows/cleanup-rust-lock.yml
          git commit -m "ci: remove one-time Rust lockfile workflows"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
