name: M2 Data Patch Once

on:
  push:
    branches:
      - agent/rust-basic-combat

permissions:
  contents: write

jobs:
  patch-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-basic-combat

      - name: Install Rust formatter
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Patch BasicUnit Fly construction
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/sim-core/src/basic_combat.rs")
          text = path.read_text(encoding="utf-8")
          marker = "    fn enemy(data: &BasicGameData) -> Self {"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one enemy constructor marker, found {text.count(marker)}")
          start = text.index(marker)
          before = text[:start]
          after = text[start:]
          replacements = [
              (marker, "    fn enemy(data: &BasicGameData) -> Result<Self> {", 1),
              ("        Self {", "        Ok(Self {", 1),
              (
                  "            attack_interval: data.monster.attack_interval,",
                  "            attack_interval: data.monster.attack_interval()?,",
                  1,
              ),
              ("        }\n    }\n\n    fn is_alive", "        })\n    }\n\n    fn is_alive", 1),
          ]
          for old, new, expected in replacements:
              count = after.count(old)
              if count != expected:
                  raise SystemExit(f"expected {expected} occurrence(s) of {old!r} in enemy section, found {count}")
              after = after.replace(old, new, expected)
          text = before + after

          old_spawn = "        self.enemy = Some(BasicUnit::enemy(&self.data));"
          new_spawn = "        self.enemy = Some(BasicUnit::enemy(&self.data)?);"
          if text.count(old_spawn) != 1:
              raise SystemExit(f"expected one Fly spawn assignment, found {text.count(old_spawn)}")
          path.write_text(text.replace(old_spawn, new_spawn, 1), encoding="utf-8")

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Remove one-time workflow
        run: rm .github/workflows/m2-data-patch-once.yml

      - name: Commit patched M2 sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates .github/workflows/m2-data-patch-once.yml
          git commit -m "rust: derive Fly runtime attack interval"
          git push origin HEAD:agent/rust-basic-combat
