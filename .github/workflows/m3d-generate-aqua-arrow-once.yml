name: M3D Generate Aqua Arrow Golden Once

on:
  push:
    branches:
      - agent/rust-direct-damage-runtime

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out M3D branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-direct-damage-runtime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and verify Aqua Arrow golden
        run: |
          npm run generate:parity -- --fixture ability-aqua-arrow-basic
          npm run check:parity -- --fixture ability-aqua-arrow-basic
          npm test -- --run src/combatsimulator/__tests__/deterministicSimulation.test.js

      - name: Remove workflow and commit golden
        run: |
          rm .github/workflows/m3d-generate-aqua-arrow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/parity/ability-aqua-arrow-basic .github/workflows/m3d-generate-aqua-arrow-once.yml
          git commit -m "test: lock Aqua Arrow reference golden"
          git push origin HEAD:agent/rust-direct-damage-runtime
