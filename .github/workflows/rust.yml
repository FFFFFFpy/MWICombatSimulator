name: Rust

on:
  pull_request:
  push:
    branches:
      - main
      - agent/rust-core-foundation
      - agent/rust-basic-combat
      - agent/rust-combat-data-snapshot
      - agent/rust-auto-attack-capabilities

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deterministic Combat Zone snapshot
        shell: bash
        run: |
          mkdir -p tmp/ci
          npm run check-rust-combat-data
          cp crates/sim-core/data/combat-zone-data-v1.json tmp/ci/combat-zone-data-committed.json
          npm run build-rust-combat-data
          cmp tmp/ci/combat-zone-data-committed.json crates/sim-core/data/combat-zone-data-v1.json
          first=$(sha256sum crates/sim-core/data/combat-zone-data-v1.json | cut -d' ' -f1)
          npm run build-rust-combat-data
          second=$(sha256sum crates/sim-core/data/combat-zone-data-v1.json | cut -d' ' -f1)
          test "$first" = "$second"

      - name: Install Rust toolchain and WASM target
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Check formatting
        id: rustfmt
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/ci
          cargo fmt --all
          git diff --check > tmp/ci/rustfmt-check.log 2>&1
          git diff -- crates > tmp/ci/rustfmt.patch
          if [ -s tmp/ci/rustfmt.patch ]; then
            cat tmp/ci/rustfmt.patch
            exit 1
          fi

      - name: Upload rustfmt diagnostics
        if: steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diagnostics
          path: |
            tmp/ci/rustfmt.patch
            tmp/ci/rustfmt-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after rustfmt diagnostics
        if: steps.rustfmt.outcome == 'failure'
        run: exit 1

      - name: Test workspace
        id: rust-tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/ci
          set +e
          cargo test --workspace --locked > tmp/ci/rust-tests.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat tmp/ci/rust-tests.log
          exit "$status"

      - name: Upload Rust test diagnostics
        if: steps.rust-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics
          path: tmp/ci/rust-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after Rust test diagnostics
        if: steps.rust-tests.outcome == 'failure'
        run: exit 1

      - name: Run Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/ci
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > tmp/ci/clippy.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat tmp/ci/clippy.log
          exit "$status"

      - name: Upload Clippy diagnostics
        if: steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: tmp/ci/clippy.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after Clippy diagnostics
        if: steps.clippy.outcome == 'failure'
        run: exit 1

      - name: Validate committed request fixtures
        run: cargo run --locked -p mwi-sim-cli -- validate-fixtures fixtures/parity

      - name: Inspect data-derived auto-attack candidates
        shell: bash
        run: |
          cargo run --locked -p mwi-sim-cli -- inspect-auto-attack-zones \
            > tmp/ci/auto-attack-capabilities.json
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync("tmp/ci/auto-attack-capabilities.json", "utf8"));
            if (value.counts?.totalZones !== 55) process.exit(1);
            if ((value.counts?.candidates ?? 0) < 1) process.exit(1);
            if (!value.candidates?.["/actions/combat/fly"]) process.exit(1);
            if ((value.counts?.candidates ?? 0) + (value.counts?.rejected ?? 0) !== value.counts.totalZones) process.exit(1);
            if (Object.values(value.rejected ?? {}).some(entry => !Array.isArray(entry.issues) || entry.issues.length === 0)) process.exit(1);
          '

      - name: Upload auto-attack candidate report
        uses: actions/upload-artifact@v4
        with:
          name: auto-attack-capability-report
          path: tmp/ci/auto-attack-capabilities.json
          if-no-files-found: error
          retention-days: 7

      - name: Run restricted basic combat fixture
        run: |
          cargo run --locked -p mwi-sim-cli -- simulate-basic fixtures/parity/zone-solo-basic/request.json \
            > tmp/ci/basic-combat-result.json

      - name: Check WASM boundary
        run: cargo check --locked -p mwi-sim-wasm --target wasm32-unknown-unknown

      - name: Verify restricted capability report
        shell: bash
        run: |
          cargo run --locked -p mwi-sim-cli -- capabilities > tmp/ci/rust-capabilities.json
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync("tmp/ci/rust-capabilities.json", "utf8"));
            if (value.combatSimulation !== true) process.exit(1);
            if (value.fullSimulationResult !== false) process.exit(1);
            if (value.resultTypes?.[0] !== "basic_combat_result") process.exit(1);
            if (value.targets?.length !== 1) process.exit(1);
            if (value.targets[0].zoneHrids?.[0] !== "/actions/combat/fly") process.exit(1);
            if (value.targets[0].players?.maximum !== 1) process.exit(1);
          '
