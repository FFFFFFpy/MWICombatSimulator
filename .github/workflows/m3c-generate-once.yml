name: M3C Generate Once

on:
  push:
    branches:
      - agent/rust-ability-data

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out M3C branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-ability-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and verify ability snapshot
        run: |
          npm run build-rust-ability-data
          npm run check-rust-ability-data

      - name: Install Rust formatter
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Remove one-time workflow
        run: rm .github/workflows/m3c-generate-once.yml

      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-rust-ability-data.mjs \
            package.json \
            crates/sim-core/data/ability-data-v1.json \
            crates/sim-core/src/ability_data.rs \
            crates/sim-core/src/lib.rs \
            .github/workflows/m3c-generate-once.yml
          git commit -m "data: generate versioned ability snapshot"
          git push origin HEAD:agent/rust-ability-data
