name: M3C Borrow Patch Once

on:
  push:
    branches:
      - agent/rust-ability-data

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-ability-data

      - name: Fix test borrow scopes
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/sim-core/src/ability_data.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        let mut ability = snapshot.ability(AQUA_ARROW_HRID).unwrap().clone();
          let effect = &mut ability.ability_effects[0];
          effect
              .extensions
              .insert("futureZero".into(), Value::from(0));
          assert!(direct_damage_issues(&ability).is_empty());

          effect
              .extensions
              .insert("futureFeature".into(), Value::from(1));
          assert!(
              direct_damage_issues(&ability)
                  .iter()
                  .any(|issue| issue.code == "unknown_effect_extension")
          );'''
          new = '''        let mut ability = snapshot.ability(AQUA_ARROW_HRID).unwrap().clone();
          ability.ability_effects[0]
              .extensions
              .insert("futureZero".into(), Value::from(0));
          assert!(direct_damage_issues(&ability).is_empty());

          ability.ability_effects[0]
              .extensions
              .insert("futureFeature".into(), Value::from(1));
          assert!(
              direct_damage_issues(&ability)
                  .iter()
                  .any(|issue| issue.code == "unknown_effect_extension")
          );'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one borrow test block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Install and run rustfmt
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0
          cargo fmt --all

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/m3c-borrow-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sim-core/src/ability_data.rs .github/workflows/m3c-borrow-patch-once.yml
          git commit -m "test: fix direct-damage classifier borrow scope"
          git push origin HEAD:agent/rust-ability-data
