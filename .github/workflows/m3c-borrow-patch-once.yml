name: M3C Borrow Patch Once

on:
  push:
    branches:
      - agent/rust-ability-data

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-ability-data

      - name: Fix test borrow scopes
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/sim-core/src/ability_data.rs")
          text = path.read_text(encoding="utf-8")
          marker = "    fn unknown_zero_extensions_do_not_reject_but_non_zero_extensions_do() {"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one target test, found {text.count(marker)}")
          head, tail = text.split(marker, 1)

          declaration = "        let effect = &mut ability.ability_effects[0];\n"
          if tail.count(declaration) != 1:
              raise SystemExit(f"expected one borrowed effect declaration in target test, found {tail.count(declaration)}")
          tail = tail.replace(declaration, "", 1)

          borrowed = "        effect\n            .extensions"
          owned = "        ability.ability_effects[0]\n            .extensions"
          if tail.count(borrowed) != 2:
              raise SystemExit(f"expected two borrowed extension writes, found {tail.count(borrowed)}")
          tail = tail.replace(borrowed, owned)
          path.write_text(head + marker + tail, encoding="utf-8")

      - name: Install and run rustfmt
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0
          cargo fmt --all

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/m3c-borrow-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sim-core/src/ability_data.rs .github/workflows/m3c-borrow-patch-once.yml
          git commit -m "test: fix direct-damage classifier borrow scope"
          git push origin HEAD:agent/rust-ability-data
