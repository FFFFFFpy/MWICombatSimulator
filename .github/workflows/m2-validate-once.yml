name: M2 Validate Once

on:
  push:
    branches:
      - agent/rust-basic-combat

permissions:
  contents: write

jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out M2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-basic-combat

      - name: Install Node and Rust
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
          rustup target add wasm32-unknown-unknown

      - name: Run validation and write report
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/m2
          set +e

          run_check() {
            name="$1"
            shift
            echo "Running $name"
            "$@" > "tmp/m2/${name}.log" 2>&1
            code=$?
            echo "$code" > "tmp/m2/${name}.code"
            return 0
          }

          run_check rustfmt cargo fmt --all -- --check
          run_check rust_tests cargo test --workspace --locked
          run_check clippy cargo clippy --workspace --all-targets --locked -- -D warnings
          run_check fixture_validation cargo run --locked -p mwi-sim-cli -- validate-fixtures fixtures/parity
          run_check basic_combat cargo run --locked -p mwi-sim-cli -- simulate-basic fixtures/parity/zone-solo-basic/request.json
          run_check wasm cargo check --locked -p mwi-sim-wasm --target wasm32-unknown-unknown
          run_check capabilities cargo run --locked -p mwi-sim-cli -- capabilities

          run_check npm_install npm ci
          run_check js_tests npm test
          run_check parity npm run check:parity
          run_check benchmark npm run benchmark:combat -- --iterations 1 --warmup 0 --simulation-seconds 30
          run_check web_build npm run build

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          order = [
              ("rustfmt", "cargo fmt --check"),
              ("rust_tests", "cargo test --workspace --locked"),
              ("clippy", "cargo clippy -D warnings"),
              ("fixture_validation", "Rust DTO validates 14 requests"),
              ("basic_combat", "zone-solo-basic restricted simulation"),
              ("wasm", "wasm32-unknown-unknown check"),
              ("capabilities", "restricted capability report"),
              ("npm_install", "npm ci"),
              ("js_tests", "JavaScript full tests"),
              ("parity", "14 JavaScript parity goldens"),
              ("benchmark", "reference benchmark smoke test"),
              ("web_build", "Vite production build"),
          ]
          root = Path("tmp/m2")
          rows = []
          failures = []
          for key, label in order:
              code = int((root / f"{key}.code").read_text().strip())
              rows.append((label, code))
              if code:
                  log = (root / f"{key}.log").read_text(errors="replace").splitlines()
                  failures.append((label, code, "\n".join(log[-120:])))

          lines = [
              "# M2 验证报告",
              "",
              f"- 生成时间：{datetime.now(timezone.utc).isoformat()}",
              "- 分支：`agent/rust-basic-combat`",
              "- 兼容级别：`basic-auto-attack-v1`",
              "",
              "## 检查结果",
              "",
              "| 检查 | 结果 |",
              "|---|---|",
          ]
          lines.extend(f"| {label} | {'通过' if code == 0 else f'失败 ({code})'} |" for label, code in rows)
          if failures:
              lines += ["", "## 失败诊断"]
              for label, code, tail in failures:
                  lines += ["", f"### {label}", "", f"退出码：`{code}`", "", "```text", tail, "```"]
          else:
              lines += [
                  "",
                  "## 结论",
                  "",
                  "M2 的受限普通攻击闭环、JavaScript 行为基线、黄金校验、基准与生产构建全部通过。",
              ]
          Path("docs/architecture/m2-validation-report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("tmp/m2/overall.code").write_text("1" if failures else "0")
          PY

          exit "$(cat tmp/m2/overall.code)"

      - name: Remove one-time workflow and commit report
        if: always()
        shell: bash
        run: |
          rm .github/workflows/m2-validate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/m2-validation-report.md .github/workflows/m2-validate-once.yml
          git commit -m "test: record M2 validation report"
          git push origin HEAD:agent/rust-basic-combat

      - name: Preserve validation result
        if: steps.validation.outcome == 'failure'
        run: exit 1
