name: M3D Rustfmt Once

on:
  push:
    branches:
      - agent/rust-direct-damage-runtime

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-direct-damage-runtime

      - name: Install rustfmt
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/m3d-rustfmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sim-core/src/direct_damage_runtime.rs crates/sim-core/src/lib.rs .github/workflows/m3d-rustfmt-once.yml
          git commit -m "style: format M3D direct-damage runtime"
          git push origin HEAD:agent/rust-direct-damage-runtime
