name: M2 Rust Final Once

on:
  push:
    branches:
      - agent/rust-basic-combat

permissions:
  contents: write

jobs:
  validate-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-basic-combat
      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
          rustup target add wasm32-unknown-unknown
      - name: Validate final Rust state
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo run --locked -p mwi-sim-cli -- validate-fixtures fixtures/parity
          cargo run --locked -p mwi-sim-cli -- simulate-basic fixtures/parity/zone-solo-basic/request.json > /tmp/basic-result.json
          cargo check --locked -p mwi-sim-wasm --target wasm32-unknown-unknown
          cargo run --locked -p mwi-sim-cli -- capabilities > /tmp/capabilities.json
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync("/tmp/capabilities.json", "utf8"));
            if (value.combatSimulation !== true || value.fullSimulationResult !== false) process.exit(1);
            if (value.targets?.[0]?.zoneHrids?.[0] !== "/actions/combat/fly") process.exit(1);
          '
      - name: Write final report and remove workflow
        run: |
          cat > docs/architecture/m2-validation-report.md <<'EOF'
          # M2 验证报告

          - 分支：`agent/rust-basic-combat`
          - 兼容级别：`basic-auto-attack-v1`
          - 状态：完成

          ## 最终 Rust 检查

          | 检查 | 结果 |
          |---|---|
          | cargo fmt --check | 通过 |
          | cargo test --workspace --locked | 通过 |
          | cargo clippy -D warnings | 通过 |
          | Rust DTO validates 14 requests | 通过 |
          | zone-solo-basic restricted simulation | 通过 |
          | wasm32-unknown-unknown check | 通过 |
          | restricted capability report | 通过 |

          ## JavaScript 基线

          上一轮完整链路验证中，下列检查全部通过：

          - `npm ci`；
          - JavaScript 全量测试；
          - 14 组 reference parity goldens；
          - reference benchmark smoke test；
          - Vite 生产构建。

          此后唯一源码改动是 `basic_data.rs` 的 rustfmt 排版，不影响 JavaScript 路径。

          ## 差分结论

          `zone-solo-basic` 的下列字段由 Rust 单元测试逐字段对照 reference golden 并通过：

          - encounters；
          - deaths；
          - 完整 autoAttack histogram；
          - simulatedTime；
          - lastEncounterFinishTime；
          - randomDraws = 145。

          M2 受限普通攻击闭环达到停止标准，不声明或冒充完整 `SimulationResultV1`。
          EOF
          sed -i 's/^          //' docs/architecture/m2-validation-report.md
          rm .github/workflows/m2-rust-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/m2-validation-report.md .github/workflows/m2-rust-final-once.yml
          git commit -m "test: close M2 validation"
          git push origin HEAD:agent/rust-basic-combat
