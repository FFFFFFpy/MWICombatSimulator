name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test random sources
        run: npx vitest run src/shared/__tests__/randomSource.test.js

      - name: Test simulation contracts
        run: npx vitest run src/contracts/__tests__/simulationContracts.test.js

      - name: Test combat trace
        run: npx vitest run src/services/__tests__/combatTrace.test.js

      - name: Test deterministic replay
        id: deterministic-replay
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/ci
          set +e
          npx vitest run src/combatsimulator/__tests__/deterministicSimulation.test.js -t "replays the same result" > tmp/ci/deterministic-replay.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload deterministic replay diagnostics
        if: steps.deterministic-replay.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-replay-diagnostics
          path: tmp/ci/deterministic-replay.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after deterministic replay diagnostics
        if: steps.deterministic-replay.outcome == 'failure'
        run: exit 1

      - name: Test trace parity
        run: npx vitest run src/combatsimulator/__tests__/deterministicSimulation.test.js -t "does not change the final result"

      - name: Run full test suite
        run: npm test

      - name: Generate expanded parity goldens
        id: parity-generate
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/ci
          set +e
          npm run generate:parity > tmp/ci/parity-generation.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload parity generation diagnostics
        if: steps.parity-generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: expanded-parity-generation-diagnostics
          path: tmp/ci/parity-generation.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after parity generation diagnostics
        if: steps.parity-generate.outcome == 'failure'
        run: exit 1

      - name: Smoke-test combat benchmark
        id: combat-benchmark
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/ci
          set +e
          npm run benchmark:combat -- --iterations 1 --warmup 0 --simulation-seconds 30 > tmp/ci/combat-benchmark.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload combat benchmark diagnostics
        if: steps.combat-benchmark.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: combat-benchmark-diagnostics
          path: tmp/ci/combat-benchmark.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after combat benchmark diagnostics
        if: steps.combat-benchmark.outcome == 'failure'
        run: exit 1

      - name: Build production bundle
        run: npm run build

      - name: Commit generated parity goldens
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/parity
          if git diff --cached --quiet; then
            echo "Parity goldens are already current."
            exit 0
          fi
          git commit -m "test: commit expanded parity goldens"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
