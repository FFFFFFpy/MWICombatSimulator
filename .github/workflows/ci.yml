name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test random sources
        run: npx vitest run src/shared/__tests__/randomSource.test.js

      - name: Test simulation contracts
        run: npx vitest run src/contracts/__tests__/simulationContracts.test.js

      - name: Test combat trace
        run: npx vitest run src/services/__tests__/combatTrace.test.js

      - name: Test deterministic replay
        run: npx vitest run src/combatsimulator/__tests__/deterministicSimulation.test.js -t "replays the same result"

      - name: Test trace parity
        run: npx vitest run src/combatsimulator/__tests__/deterministicSimulation.test.js -t "does not change the final result"

      - name: Run full test suite
        run: npm test

      - name: Smoke-test combat benchmark
        run: npm run benchmark:combat -- --iterations 1 --warmup 0 --simulation-seconds 30

      - name: Build production bundle
        run: npm run build
