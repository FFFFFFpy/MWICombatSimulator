name: M2 Final Validate Once

on:
  push:
    branches:
      - agent/rust-basic-combat

permissions:
  contents: write

jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-basic-combat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
          rustup target add wasm32-unknown-unknown
      - name: Validate
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/m2
          set +e
          check() { key="$1"; shift; "$@" > "tmp/m2/${key}.log" 2>&1; echo "$?" > "tmp/m2/${key}.code"; }
          check rustfmt cargo fmt --all -- --check
          check rust_tests cargo test --workspace --locked
          check clippy cargo clippy --workspace --all-targets --locked -- -D warnings
          check fixtures cargo run --locked -p mwi-sim-cli -- validate-fixtures fixtures/parity
          check basic cargo run --locked -p mwi-sim-cli -- simulate-basic fixtures/parity/zone-solo-basic/request.json
          check wasm cargo check --locked -p mwi-sim-wasm --target wasm32-unknown-unknown
          check capabilities cargo run --locked -p mwi-sim-cli -- capabilities
          check npm_install npm ci
          check js_tests npm test
          check parity npm run check:parity
          check benchmark npm run benchmark:combat -- --iterations 1 --warmup 0 --simulation-seconds 30
          check build npm run build
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          checks = [
              ("rustfmt", "cargo fmt --check"), ("rust_tests", "cargo test --workspace --locked"),
              ("clippy", "cargo clippy -D warnings"), ("fixtures", "Rust DTO validates 14 requests"),
              ("basic", "zone-solo-basic restricted simulation"), ("wasm", "WASM target check"),
              ("capabilities", "restricted capability report"), ("npm_install", "npm ci"),
              ("js_tests", "JavaScript full tests"), ("parity", "14 JavaScript parity goldens"),
              ("benchmark", "reference benchmark smoke test"), ("build", "Vite production build"),
          ]
          root = Path("tmp/m2")
          results, failures = [], []
          for key, label in checks:
              code = int((root / f"{key}.code").read_text().strip())
              results.append((label, code))
              if code:
                  failures.append((label, code, "\n".join((root / f"{key}.log").read_text(errors="replace").splitlines()[-120:])))
          lines = ["# M2 验证报告", "", f"- 生成时间：{datetime.now(timezone.utc).isoformat()}",
                   "- 分支：`agent/rust-basic-combat`", "- 兼容级别：`basic-auto-attack-v1`", "",
                   "## 检查结果", "", "| 检查 | 结果 |", "|---|---|"]
          lines += [f"| {label} | {'通过' if code == 0 else f'失败 ({code})'} |" for label, code in results]
          if failures:
              lines += ["", "## 失败诊断"]
              for label, code, tail in failures:
                  lines += ["", f"### {label}", "", f"退出码：`{code}`", "", "```text", tail, "```"]
          else:
              lines += ["", "## 结论", "", "M2 受限普通攻击闭环及全部 Rust、JavaScript 验证均通过。", "",
                        "`zone-solo-basic` 的 encounters、deaths、完整 autoAttack histogram、simulatedTime、lastEncounterFinishTime 和 145 次随机消费均由 Rust 单元测试逐字段对照 reference golden。"]
          Path("docs/architecture/m2-validation-report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("tmp/m2/overall.code").write_text("1" if failures else "0")
          PY
          exit "$(cat tmp/m2/overall.code)"
      - name: Commit report and remove workflow
        if: always()
        run: |
          rm .github/workflows/m2-final-validate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/m2-validation-report.md .github/workflows/m2-final-validate-once.yml
          git commit -m "test: finalize M2 validation report"
          git push origin HEAD:agent/rust-basic-combat
      - name: Preserve result
        if: steps.validation.outcome == 'failure'
        run: exit 1
