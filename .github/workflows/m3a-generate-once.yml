name: M3A Generate Once

on:
  push:
    branches:
      - agent/rust-combat-data-snapshot

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out M3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-combat-data-snapshot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch fallback attack interval source
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/build-rust-combat-data.mjs")
          text = path.read_text(encoding="utf-8")
          old = """        baseAttackInterval: nonNegativeNumber(\n            combatDetails.attackInterval || 0,\n            `${hrid}.combatDetails.attackInterval`,\n        ),"""
          new = """        baseAttackInterval: nonNegativeNumber(\n            combatDetails.combatStats?.attackInterval ?? combatDetails.attackInterval ?? 0,\n            `${hrid}.combatDetails.attackInterval`,\n        ),"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one base attack interval expression, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Generate and verify snapshot
        run: |
          npm run build-rust-combat-data
          npm run check-rust-combat-data

      - name: Install Rust formatter
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Remove one-time workflow
        run: rm .github/workflows/m3a-generate-once.yml

      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-rust-combat-data.mjs \
            package.json \
            crates/sim-core/data/combat-zone-data-v1.json \
            crates/sim-core/src/combat_data.rs \
            crates/sim-core/src/lib.rs \
            .github/workflows/m3a-generate-once.yml
          git commit -m "data: generate versioned Combat Zone snapshot"
          git push origin HEAD:agent/rust-combat-data-snapshot
