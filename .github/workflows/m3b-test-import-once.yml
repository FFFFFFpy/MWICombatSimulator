name: M3B Test Import Once

on:
  push:
    branches:
      - agent/rust-auto-attack-capabilities

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-auto-attack-capabilities
      - name: Scope Fly constant to tests
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/sim-core/src/auto_attack_capabilities.rs")
          text = path.read_text(encoding="utf-8")
          old = """use crate::{\n    BASIC_FLY_ZONE_HRID, CombatMonsterDataV1, CombatZoneDataSnapshotV1, CombatZoneDataV1, Result,\n};"""
          new = """use crate::{CombatMonsterDataV1, CombatZoneDataSnapshotV1, CombatZoneDataV1, Result};\n\n#[cfg(test)]\nuse crate::BASIC_FLY_ZONE_HRID;"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one import block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Install and run rustfmt
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0
          cargo fmt --all
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/m3b-test-import-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sim-core/src/auto_attack_capabilities.rs .github/workflows/m3b-test-import-once.yml
          git commit -m "rust: scope Fly capability constant to tests"
          git push origin HEAD:agent/rust-auto-attack-capabilities
