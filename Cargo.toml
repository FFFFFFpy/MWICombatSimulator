[workspace]
members = [
    "crates/sim-core",
    "crates/sim-wasm",
    "crates/sim-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FFFFFFpy/MWICombatSimulator"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
